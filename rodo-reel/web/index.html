<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RODO ACCESSORIES — Tyre Reel</title>
<style>
  :root {
    --red: #e3202a;
    --red-glow: rgba(255, 40, 40, 0.65);
    --silver: #c9ced6;
    --white: #f4f5f7;
    --grey: #8b9099;
    --display: "Inter Display", "Inter", "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", "DejaVu Sans Mono", monospace;
  }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; }
  .layer { position: absolute; inset: 0; pointer-events: none; }
  #vignette { background: radial-gradient(ellipse 85% 70% at 50% 45%, transparent 45%, rgba(0,0,0,0.55) 80%, rgba(0,0,0,0.9) 100%); }
  #grain { width: 1080px; height: 1920px; opacity: 0.075; mix-blend-mode: overlay; }
  #flash { background: #fff; opacity: 0; mix-blend-mode: screen; }
  #streak { opacity: 0; mix-blend-mode: screen;
    background: linear-gradient(100deg, transparent 0%, transparent 42%, rgba(255,255,255,0.0) 45%, rgba(255,240,230,0.85) 50%, rgba(255,255,255,0.0) 55%, transparent 58%); }
  #textshade { background: linear-gradient(180deg, rgba(0,0,0,0.0) 40%, rgba(0,0,0,0.65) 72%, rgba(0,0,0,0.85) 100%); opacity: 0; }
  #topshade { background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.0) 32%); opacity: 0; }

  .t { position: absolute; left: 0; width: 1080px; text-align: center; color: var(--white); font-family: var(--display);
       will-change: transform, opacity, filter; white-space: nowrap; opacity: 0; }
  .t .m { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.04em 0 0.08em; margin-bottom: -0.12em; }
  .t .c { display: inline-block; will-change: transform; }
  .hero { font-weight: 900; letter-spacing: -0.01em; line-height: 1;
          text-shadow: 0 2px 0 rgba(0,0,0,0.25), 0 6px 24px rgba(0,0,0,0.55); }
  .red { color: var(--red); text-shadow: 0 0 28px rgba(255, 30, 30, 0.45), 0 6px 24px rgba(0,0,0,0.6); }
  .mono { font-family: var(--mono); font-weight: 600; letter-spacing: 0.22em; font-size: 24px; color: #b4b9c1; }
  .sub { font-weight: 500; font-size: 42px; line-height: 1.3; color: rgba(244,245,247,0.92); white-space: normal; padding: 0 120px; box-sizing: border-box; }
  .sub b { color: #fff; font-weight: 800; }
  .sub em { font-style: normal; color: var(--red); font-weight: 700; }

  /* Scene title: big outline number + label */
  .num { position: absolute; font-family: var(--display); font-weight: 900; font-size: 230px; line-height: 1; letter-spacing: -0.04em; opacity: 0; }
  .num .o { color: transparent; -webkit-text-stroke: 2.5px rgba(220,224,230,0.9); }
  .num .f { position: absolute; left: 0; top: 0; color: var(--white); background: linear-gradient(180deg, #ffffff 0%, #d9dde3 45%, #8d939c 100%);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .label { position: absolute; font-family: var(--display); font-weight: 800; font-size: 64px; line-height: 1.02; letter-spacing: 0.01em; color: var(--white); opacity: 0; text-align: left; }
  .rule { position: absolute; height: 4px; background: var(--red); box-shadow: 0 0 18px var(--red-glow); transform-origin: left center; }

  .metal { background: linear-gradient(100deg, #6f747c 0%, #e9ecf0 22%, #9aa0a8 38%, #ffffff var(--sheen, 50%), #8e949c 62%, #dfe3e8 80%, #6c7179 100%);
           background-size: 100% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
           filter: drop-shadow(0 3px 0 rgba(0,0,0,0.6)) drop-shadow(0 10px 30px rgba(0,0,0,0.7)); }
  .chrome .c { background: linear-gradient(180deg, #ffffff 0%, #e4e7eb 38%, #8b919a 52%, #c9ced6 70%, #f2f4f6 100%);
           -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .chrome { text-shadow: none; filter: drop-shadow(0 4px 14px rgba(0,0,0,0.6)); }
  .pill { display: inline-block; border: 2.5px solid var(--red); border-radius: 999px; padding: 22px 54px; font-weight: 800; font-size: 38px; letter-spacing: 0.14em; box-shadow: 0 0 30px rgba(227,32,42,0.35), inset 0 0 24px rgba(227,32,42,0.18); background: rgba(10,10,12,0.55); }

  svg text { font-family: var(--mono); }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1080" height="1920"></canvas>
  <div id="topshade" class="layer"></div>
  <div id="textshade" class="layer"></div>
  <svg id="hud" class="layer" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
  <div id="texts" class="layer"></div>
  <div id="vignette" class="layer"></div>
  <div id="streak" class="layer"></div>
  <canvas id="grain" class="layer" width="270" height="480"></canvas>
  <div id="flash" class="layer"></div>
</div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
