<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rodo Tyres Reel</title>
    <style>
      @font-face { font-family: 'Anton'; src: url(fonts/Anton-Regular.woff2) format('woff2'); font-weight: 400; }
      @font-face { font-family: 'Barlow Condensed'; src: url(fonts/BarlowCondensed-600.woff2) format('woff2'); font-weight: 600; }
      @font-face { font-family: 'Barlow Condensed'; src: url(fonts/BarlowCondensed-700.woff2) format('woff2'); font-weight: 700; }
      @font-face { font-family: 'Barlow Condensed'; src: url(fonts/BarlowCondensed-800.woff2) format('woff2'); font-weight: 800; }
      @font-face { font-family: 'Barlow Condensed'; src: url(fonts/BarlowCondensed-900.woff2) format('woff2'); font-weight: 900; }
      @font-face { font-family: 'Barlow Condensed'; src: url(fonts/BarlowCondensed-800-Italic.woff2) format('woff2'); font-weight: 800; font-style: italic; }
      @font-face { font-family: 'Barlow Condensed'; src: url(fonts/BarlowCondensed-900-Italic.woff2) format('woff2'); font-weight: 900; font-style: italic; }
      html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 14px system-ui, sans-serif; }
      body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
      #reel { height: calc(100vh - 70px); aspect-ratio: 9 / 16; background: #000; box-shadow: 0 0 40px #000; }
      #ui { display: flex; gap: 10px; align-items: center; }
      #scrub { width: min(60vw, 420px); }
      button, select { font: inherit; padding: 4px 12px; }
      body.render { display: block; background: #000; }
      body.render #reel { height: auto; width: 1080px; box-shadow: none; }
      body.render #ui { display: none; }
    </style>
  </head>
  <body>
    <canvas id="reel" width="1080" height="1920"></canvas>
    <div id="ui">
      <button id="play">Play</button>
      <input id="scrub" type="range" min="0" max="22" step="0.0333" value="0" />
      <span id="time">0.00s</span>
      <select id="variant">
        <option value="three">3 contact cards</option>
        <option value="merged">Shared tyre number</option>
      </select>
    </div>
    <script src="src/config.js"></script>
    <script src="src/lib.js"></script>
    <script src="src/timeline.js"></script>
    <script src="src/map-data.js"></script>
    <script src="src/props.js"></script>
    <script src="src/scenes.js"></script>
    <script src="src/audio.js"></script>
    <script src="src/main.js"></script>
  </body>
</html>
